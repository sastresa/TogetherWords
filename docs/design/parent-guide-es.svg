<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1170" role="img" aria-label="Concepto de la pantalla Para adultos en español">
  <defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#243C43}.title{font-size:31px;font-weight:700}.h2{font-size:21px;font-weight:700}.body{font-size:15px}.step{font-size:12px;font-weight:700;letter-spacing:1px;fill:#275B61}.small{font-size:12px;fill:#52676C}</style></defs>
  <rect width="390" height="1170" fill="#F7F6F0"/>
  <text x="24" y="32" class="small">9:41</text>
  <circle cx="348" cy="26" r="3" fill="#243C43"/><circle cx="357" cy="26" r="3" fill="#243C43"/><rect x="365" y="23" width="10" height="6" rx="2" fill="#243C43"/>
  <text x="24" y="79" font-size="16" font-weight="700" fill="#275B61">‹ Volver</text>
  <text x="24" y="133" class="title">Para adultos</text>

  <rect x="20" y="158" width="350" height="65" rx="20" fill="#FFFFFF"/>
  <text x="40" y="184" class="small">IDIOMA</text>
  <text x="40" y="207" font-size="16" font-weight="700">Idioma del móvil</text>
  <text x="344" y="199" font-size="20" text-anchor="end">⌄</text>

  <rect x="20" y="245" width="350" height="145" rx="23" fill="#D9EEE5"/>
  <text x="40" y="279" class="h2">Sobre las rabietas</text>
  <text x="40" y="307" class="body">Son habituales en la primera infancia.</text>
  <text x="40" y="330" class="body">Pueden aparecer por cansancio, hambre,</text>
  <text x="40" y="353" class="body">frustración o falta de palabras.</text>

  <text x="24" y="432" class="h2">Cómo ayuda esta app</text>
  <text x="24" y="460" class="body">Las tarjetas ofrecen frases para practicar</text>
  <text x="24" y="483" class="body">en calma. Si empieza a abrumarse, puedes</text>
  <text x="24" y="506" class="body">ofrecerlas o tocar el globo juntos. Si no</text>
  <text x="24" y="529" class="body">quiere, guarda el móvil.</text>

  <text x="24" y="582" class="h2">Guía práctica</text>
  <rect x="20" y="605" width="350" height="112" rx="21" fill="#FFFFFF"/>
  <text x="40" y="633" class="step">ANTES</text>
  <text x="40" y="660" class="body">Observa sueño, hambre o sobrecarga.</text>
  <text x="40" y="683" class="body">Practicad sin exigir que repita.</text>

  <rect x="20" y="730" width="350" height="138" rx="21" fill="#FFFFFF"/>
  <text x="40" y="758" class="step">DURANTE</text>
  <text x="40" y="785" class="body">Primero, seguridad. Habla poco y con</text>
  <text x="40" y="808" class="body">calma; quédate cerca. No le obligues</text>
  <text x="40" y="831" class="body">a hablar ni a seguir un ritmo.</text>

  <rect x="20" y="881" width="350" height="113" rx="21" fill="#FFFFFF"/>
  <text x="40" y="909" class="step">DESPUÉS</text>
  <text x="40" y="936" class="body">Cuando estéis tranquilos, pon palabras</text>
  <text x="40" y="959" class="body">a lo ocurrido y escucha.</text>

  <text x="24" y="1034" class="h2">Si te preocupa</text>
  <text x="24" y="1062" class="body">Si hay riesgo de lesiones o te preocupa</text>
  <text x="24" y="1085" class="body">la frecuencia o intensidad, consulta al</text>
  <text x="24" y="1108" class="body">pediatra. La app no detiene rabietas.</text>
  <text x="24" y="1146" class="small">Fuentes: NHS · CDC · UNICEF</text>
</svg>
