<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1170" role="img" aria-label="English For adults screen concept">
  <defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#243C43}.title{font-size:31px;font-weight:700}.h2{font-size:21px;font-weight:700}.body{font-size:15px}.step{font-size:12px;font-weight:700;letter-spacing:1px;fill:#275B61}.small{font-size:12px;fill:#52676C}</style></defs>
  <rect width="390" height="1170" fill="#F7F6F0"/>
  <text x="24" y="32" class="small">9:41</text>
  <circle cx="348" cy="26" r="3" fill="#243C43"/><circle cx="357" cy="26" r="3" fill="#243C43"/><rect x="365" y="23" width="10" height="6" rx="2" fill="#243C43"/>
  <text x="24" y="79" font-size="16" font-weight="700" fill="#275B61">‹ Back</text>
  <text x="24" y="133" class="title">For adults</text>

  <rect x="20" y="158" width="350" height="65" rx="20" fill="#FFFFFF"/>
  <text x="40" y="184" class="small">LANGUAGE</text>
  <text x="40" y="207" font-size="16" font-weight="700">Device language</text>
  <text x="344" y="199" font-size="20" text-anchor="end">⌄</text>

  <rect x="20" y="245" width="350" height="145" rx="23" fill="#D9EEE5"/>
  <text x="40" y="279" class="h2">About tantrums</text>
  <text x="40" y="307" class="body">They are common in early childhood.</text>
  <text x="40" y="330" class="body">Tiredness, hunger, frustration, or</text>
  <text x="40" y="353" class="body">difficulty finding words can play a part.</text>

  <text x="24" y="432" class="h2">How this app can help</text>
  <text x="24" y="460" class="body">The cards offer phrases to practise when</text>
  <text x="24" y="483" class="body">calm. If your child starts to feel</text>
  <text x="24" y="506" class="body">overwhelmed, offer a card or the balloon.</text>
  <text x="24" y="529" class="body">If they do not want it, put the phone aside.</text>

  <text x="24" y="582" class="h2">Practical steps</text>
  <rect x="20" y="605" width="350" height="112" rx="21" fill="#FFFFFF"/>
  <text x="40" y="633" class="step">BEFORE</text>
  <text x="40" y="660" class="body">Notice tiredness, hunger, or overload.</text>
  <text x="40" y="683" class="body">Practise without requiring repetition.</text>

  <rect x="20" y="730" width="350" height="138" rx="21" fill="#FFFFFF"/>
  <text x="40" y="758" class="step">DURING</text>
  <text x="40" y="785" class="body">Safety first. Use a few calm words and</text>
  <text x="40" y="808" class="body">stay nearby. Do not require speech or</text>
  <text x="40" y="831" class="body">breathing to a set rhythm.</text>

  <rect x="20" y="881" width="350" height="113" rx="21" fill="#FFFFFF"/>
  <text x="40" y="909" class="step">AFTER</text>
  <text x="40" y="936" class="body">Once you are both calm, name what</text>
  <text x="40" y="959" class="body">happened and listen.</text>

  <text x="24" y="1034" class="h2">If you are concerned</text>
  <text x="24" y="1062" class="body">If injuries are possible, or the frequency</text>
  <text x="24" y="1085" class="body">or intensity worries you, speak with a child</text>
  <text x="24" y="1108" class="body">health professional. The app cannot stop tantrums.</text>
  <text x="24" y="1146" class="small">Sources: NHS · CDC · UNICEF</text>
</svg>
